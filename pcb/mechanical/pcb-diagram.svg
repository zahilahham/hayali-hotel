  <text x="138" y="148" font-family="Consolas, monospace" font-size="10" fill="#dcfce7">M2.5</text>

  <rect x="250" y="118" width="260" height="34" rx="3" fill="#fbbf24" stroke="#0f172a" stroke-width="1.5"/>
  <g font-family="Consolas, monospace" font-size="11" fill="#0f172a">
    <text x="262" y="139">1 RESET</text>
    <text x="330" y="139">2 GND</text>
    <text x="385" y="139">3 RX0</text>
    <text x="440" y="139">4 TX0</text>
    <text x="495" y="139">5 5V</text>
  </g>
  <text x="250" y="110" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0f172a">J_DISP female 1x5 - plugs onto screen</text>

  <path d="M 520 152 L 520 200 L 200 200 L 200 230" fill="none" stroke="#fde68a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="210" y="195" font-family="Consolas, monospace" font-size="11" fill="#fef9c3">VBUS 5V</text>

