<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <title>HAYALI-GW-USB-C-R1 PCB diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#f8fafc"/>
  <text x="32" y="36" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#0f172a">HAYALI-GW-USB-C-R1 - PCB top view</text>
  <text x="32" y="58" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">Conceptual layout (~48 x 32 mm). Not manufacturing Gerbers.</text>

  <rect x="620" y="18" width="14" height="14" fill="#166534" stroke="#0f172a"/>
  <text x="642" y="30" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">PCB</text>
  <rect x="680" y="18" width="14" height="14" fill="#fbbf24" stroke="#0f172a"/>
  <text x="702" y="30" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Connectors</text>
