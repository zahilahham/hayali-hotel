  <text x="175" y="252" font-family="Consolas, monospace" font-size="12" fill="#dcfce7">F1 1.5A</text>
  <text x="175" y="268" font-family="Consolas, monospace" font-size="11" fill="#bbf7d0">polyfuse</text>

  <rect x="160" y="300" width="100" height="50" rx="4" fill="#14532d" stroke="#dcfce7"/>
  <text x="175" y="322" font-family="Consolas, monospace" font-size="12" fill="#dcfce7">U_REG</text>
