  <text x="340" y="320" font-family="Consolas, monospace" font-size="12" fill="#86efac">GPIO16 RX2  &lt;- TX0</text>
  <text x="340" y="340" font-family="Consolas, monospace" font-size="12" fill="#86efac">GPIO17 TX2  -&gt; RX0</text>
  <text x="505" y="305" font-family="Consolas, monospace" font-size="10" fill="#e2e8f0">ANT</text>

  <path d="M 430 230 L 430 152" fill="none" stroke="#86efac" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="438" y="200" font-family="Consolas, monospace" font-size="10" fill="#86efac">UART</text>

  <circle cx="580" cy="400" r="10" fill="#22c55e" stroke="#0f172a"/>
  <text x="560" y="425" font-family="Consolas, monospace" font-size="10" fill="#dcfce7">PWR</text>
  <circle cx="580" cy="450" r="10" fill="#38bdf8" stroke="#0f172a"/>
  <text x="560" y="475" font-family="Consolas, monospace" font-size="10" fill="#dcfce7">ACT</text>

  <rect x="300" y="455" width="160" height="40" rx="10" fill="#fbbf24" stroke="#0f172a" stroke-width="1.5"/>
  <text x="330" y="480" font-family="Consolas, monospace" font-size="13" fill="#0f172a">J_USB  USB-C</text>
  <text x="300" y="515" font-family="Segoe UI, sans-serif" font-size="12" fill="#0f172a">One cable: powers ESP32 + screen</text>

  <rect x="670" y="150" width="200" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="690" y="180" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Signal flow</text>
  <text x="690" y="210" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">1. USB-C 5V in</text>
  <text x="690" y="235" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">2. Fuse to DISP 5V</text>
  <text x="690" y="260" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">3. LDO makes 3.3V</text>
  <text x="690" y="285" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">4. ESP32 Wi-Fi</text>
  <text x="690" y="310" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">5. UART to Genie</text>
  <text x="690" y="350" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Fits:</text>
  <text x="690" y="375" font-family="Consolas, monospace" font-size="12" fill="#166534">gen4-uLCD-70DT</text>
  <text x="690" y="395" font-family="Consolas, monospace" font-size="12" fill="#166534">gen4-uLCD-43DT</text>
  <text x="690" y="425" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">Same 5-way pinout</text>

  <text x="32" y="580" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">File: pcb/mechanical/pcb-diagram.svg - Full pack: pcb/README.md</text>
