  <text x="812" y="30" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Modules</text>

  <rect x="120" y="80" width="520" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="140" y="103" font-family="Segoe UI, sans-serif" font-size="13" fill="#334155">gen4 display rear (7 inch or 4.3 inch) - 5-way male pins mate here</text>

  <rect x="120" y="130" width="520" height="360" rx="14" fill="#166534" stroke="#0f172a" stroke-width="2"/>

  <circle cx="150" cy="160" r="9" fill="#f8fafc" stroke="#0f172a"/>
  <circle cx="610" cy="160" r="9" fill="#f8fafc" stroke="#0f172a"/>
  <circle cx="150" cy="460" r="9" fill="#f8fafc" stroke="#0f172a"/>
